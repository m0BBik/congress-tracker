name: Update Senate transaction data

on:
  schedule:
    # Runs once a day at 09:15 UTC. Cron on GitHub Actions can lag by a few
    # minutes at busy times — that's normal and fine for a daily job.
    - cron: "15 9 * * *"
  workflow_dispatch:
    # Lets you trigger it manually from the Actions tab, e.g. for the first
    # backfill run with a bigger LOOKBACK_DAYS.
    inputs:
      lookback_days:
        description: "How many days back to check for filings"
        required: false
        default: "14"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright requests pyyaml
          playwright install --with-deps chromium

      - name: Refresh senator/party roster
        run: python scraper/update_party.py

      - name: Run scraper
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
        run: python scraper/scrape_senate.py

      - name: Commit updated data (if any changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/senate_transactions.json data/senators_party.json
          if git diff --cached --quiet; then
            echo "No new data today — nothing to commit."
          else
            git commit -m "chore: update Senate transaction data $(date -u +%Y-%m-%d)"
            git push
          fi
